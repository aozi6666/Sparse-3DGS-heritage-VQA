<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mage-VL · 流式视频问答</title>
  <style>
    :root { font-family: Inter, "PingFang SC", "Microsoft YaHei", sans-serif; color: #eaf1ff; background: #07111f; }
    * { box-sizing: border-box; } body { margin: 0; min-height: 100vh; background: radial-gradient(900px 460px at 10% -5%, #1f5fad60, transparent 70%), radial-gradient(600px 380px at 95% 8%, #843ee544, transparent 75%), #07111f; }
    .shell { width: min(1240px, calc(100% - 32px)); margin: auto; padding: 26px 0 40px; } .top { display:flex; align-items:center; justify-content:space-between; gap:20px; }
    .brand { display:flex; align-items:center; gap:12px; font-weight:750; font-size:19px; letter-spacing:-.3px; } .mark { width:34px; height:34px; border-radius:11px; display:grid; place-items:center; background:linear-gradient(145deg,#7d63ff,#297cf5); box-shadow:0 8px 24px #4e55c980; font-size:16px; }
    .badge { color:#bcd2f4; border:1px solid #2a4970; background:#10223a9c; padding:7px 10px; border-radius:99px; font-size:12px; } h1 { font-size:clamp(30px,5vw,52px); letter-spacing:-2.4px; margin:52px 0 12px; max-width:760px; } .intro { color:#a8bdd9; font-size:17px; line-height:1.65; margin:0 0 28px; max-width:700px; }
    .workspace { display:grid; grid-template-columns:minmax(0,1.32fr) minmax(345px,.88fr); gap:18px; align-items:stretch; } .card { background:linear-gradient(145deg,#11243cda,#0c192bcf); border:1px solid #254467; box-shadow:0 20px 58px #02081450; border-radius:22px; overflow:hidden; }
    .video-card { min-height:536px; padding:14px; display:grid; } .drop-zone { min-height:506px; border:1.5px dashed #4575ae; border-radius:15px; display:grid; place-items:center; text-align:center; padding:32px; background:linear-gradient(135deg,#1429448c,#0d1c30a8); transition:.2s ease; } .drop-zone.dragging { border-color:#92c1ff; background:#1c4173ad; transform:scale(.995); }
    .upload-icon { width:68px; height:68px; margin:0 auto 18px; display:grid; place-items:center; border-radius:20px; background:#1e497b; color:#abceff; font-size:30px; } .drop-zone h2 { font-size:21px; margin:0 0 8px; } .drop-zone p { color:#a0b5d2; margin:0 0 20px; line-height:1.55; }
    button,input { font:inherit; } button { border:0; cursor:pointer; color:white; font-weight:650; border-radius:10px; transition:transform .16s ease,filter .16s ease; } button:hover:not(:disabled) { transform:translateY(-1px); filter:brightness(1.08); } button:disabled { cursor:not-allowed; opacity:.48; } .primary { background:linear-gradient(135deg,#347ef7,#7058ed); padding:12px 17px; box-shadow:0 8px 20px #285dbb70; } .hint { color:#7892b6; font-size:12px; margin:14px 0 0 !important; }
    #video { display:none; width:100%; max-height:508px; align-self:center; border-radius:13px; background:#02060c; } .video-toolbar { display:none; align-items:center; justify-content:space-between; gap:12px; margin:10px 2px 0; color:#adc4e2; font-size:13px; } .secondary { background:#1c3454; padding:8px 12px; color:#c7ddfb; font-size:13px; }
    .chat-card { display:flex; flex-direction:column; min-height:536px; } .chat-head { padding:20px 20px 16px; border-bottom:1px solid #223d5e; } .chat-title { display:flex; justify-content:space-between; align-items:center; gap:8px; font-size:16px; font-weight:700; } .live { color:#93e6bd; font-size:12px; font-weight:600; } #status { color:#91accf; font-size:13px; margin:9px 0 0; min-height:20px; }
    #messages { flex:1; min-height:292px; max-height:430px; overflow:auto; padding:16px 18px; display:flex; flex-direction:column; gap:13px; } .message { max-width:94%; padding:11px 13px; border-radius:13px; white-space:pre-wrap; font-size:14px; line-height:1.58; } .message.user { align-self:flex-end; background:linear-gradient(135deg,#296be5,#5e55d4); border-bottom-right-radius:4px; } .message.assistant { align-self:flex-start; background:#172c48; color:#d8e7fb; border-bottom-left-radius:4px; } .meta { color:#8daed8; font-size:11px; margin-bottom:5px; }
    .composer { padding:14px; border-top:1px solid #223d5e; } .input-row { display:flex; gap:8px; align-items:stretch; } #question { flex:1; min-width:0; resize:none; padding:11px 12px; color:#eaf1ff; line-height:1.45; border-radius:11px; border:1px solid #355778; background:#08182a; outline:none; } #question:focus { border-color:#639dff; box-shadow:0 0 0 3px #397dff25; } #ask { min-width:76px; padding:0 13px; } .composer-tip { color:#7490b5; font-size:11px; margin:9px 2px 0; }
    .error { color:#ffb4bc !important; } @media(max-width:850px) { .workspace { grid-template-columns:1fr; } h1 { margin-top:34px; } .video-card,.chat-card { min-height:460px; } .drop-zone { min-height:430px; } #messages { max-height:340px; } } @media(max-width:480px) { .shell { width:min(100% - 22px,1240px); } .badge { display:none; } h1 { letter-spacing:-1.4px; } .input-row { align-items:stretch; } }
  </style>
</head>
<body>
  <main class="shell">
    <header class="top"><div class="brand"><span class="mark">✦</span><span>Mage-VL Studio</span></div><span class="badge">因果视频理解 · 当前 + 短时记忆</span></header>
    <h1>看懂正在播放的每一秒</h1>
    <p class="intro">上传视频后即可播放和提问。回答只基于播放头所在画面与此前短时动态，不使用未来内容。</p>
    <section class="workspace">
      <article class="card video-card">
        <div id="drop-zone" class="drop-zone" tabindex="0" role="button" aria-label="选择视频文件">
          <div><div class="upload-icon">↑</div><h2>导入一个视频</h2><p>点击选择，或直接拖拽文件到这里</p><button id="select-file" class="primary" type="button">选择本地视频</button><p id="upload-status" class="hint">支持 MP4、MOV、WebM、AVI、MKV</p></div>
        </div>
        <input id="file" type="file" accept="video/mp4,video/quicktime,video/webm,video/x-msvideo,video/x-matroska,.mp4,.mov,.m4v,.webm,.avi,.mkv" hidden>
        <video id="video" controls playsinline></video>
        <div id="video-toolbar" class="video-toolbar"><span id="video-info">视频已就绪</span><button id="replace-file" class="secondary" type="button">更换视频</button></div>
      </article>
      <article class="card chat-card">
        <div class="chat-head"><div class="chat-title"><span>视频问答</span><span id="engine-state" class="live">等待视频</span></div><p id="status">先上传视频，系统会自动读取时长。</p></div>
        <div id="messages"><div class="message assistant"><div class="meta">使用方式</div>播放视频后，随时询问“刚才发生了什么？”、“画面里有什么？”或“人物接下来在做什么？”。</div></div>
        <form id="form" class="composer"><div class="input-row"><textarea id="question" rows="2" placeholder="上传视频后在这里输入问题…" autocomplete="off" disabled></textarea><button id="ask" class="primary" type="submit" disabled>发送</button></div><div class="composer-tip">按 Ctrl / ⌘ + Enter 发送 · 回答会绑定当前播放时间</div></form>
      </article>
    </section>
  </main>
  <script>
    const fileInput = document.querySelector('#file'), selectFile = document.querySelector('#select-file'), replaceFile = document.querySelector('#replace-file');
    const dropZone = document.querySelector('#drop-zone'), video = document.querySelector('#video'), toolbar = document.querySelector('#video-toolbar'), videoInfo = document.querySelector('#video-info');
    const question = document.querySelector('#question'), ask = document.querySelector('#ask'), form = document.querySelector('#form'), messages = document.querySelector('#messages');
    const status = document.querySelector('#status'), uploadStatus = document.querySelector('#upload-status'), engineState = document.querySelector('#engine-state'); let videoId = null, busy = false;
    function setStatus(text, isError = false) { status.textContent = text; status.classList.toggle('error', isError); }
    function message(kind, text, meta = '') { const node = document.createElement('div'); node.className = `message ${kind}`; if (meta) { const header = document.createElement('div'); header.className = 'meta'; header.textContent = meta; node.append(header); } const content = document.createElement('span'); content.textContent = text; node.append(content); messages.append(node); messages.scrollTop = messages.scrollHeight; return content; }
    function openPicker() { if (!busy) fileInput.click(); }
    selectFile.addEventListener('click', openPicker); replaceFile.addEventListener('click', openPicker); dropZone.addEventListener('click', event => { if (!event.target.closest('button')) openPicker(); }); dropZone.addEventListener('keydown', event => { if (event.key === 'Enter' || event.key === ' ') { event.preventDefault(); openPicker(); } });
    ['dragenter','dragover'].forEach(name => dropZone.addEventListener(name, event => { event.preventDefault(); dropZone.classList.add('dragging'); })); ['dragleave','drop'].forEach(name => dropZone.addEventListener(name, event => { event.preventDefault(); dropZone.classList.remove('dragging'); })); dropZone.addEventListener('drop', event => upload(event.dataTransfer.files[0])); fileInput.addEventListener('change', () => upload(fileInput.files[0]));
    async function upload(selected) { if (!selected) return; if (!selected.type.startsWith('video/') && !/\.(mp4|mov|m4v|webm|avi|mkv)$/i.test(selected.name)) { uploadStatus.textContent = '请选择 MP4、MOV、WebM、AVI 或 MKV 视频。'; uploadStatus.classList.add('error'); return; } busy = true; selectFile.disabled = true; uploadStatus.classList.remove('error'); uploadStatus.textContent = `正在上传 ${selected.name}…`; setStatus('正在读取视频，请稍候。'); engineState.textContent = '上传中'; const data = new FormData(); data.append('video', selected); try { const response = await fetch('/api/videos', { method:'POST', body:data }); const result = await response.json(); if (!response.ok) throw new Error(result.detail || '服务器拒绝了该视频'); videoId = result.video_id; video.src = result.url; video.load(); video.style.display = 'block'; dropZone.style.display = 'none'; toolbar.style.display = 'flex'; videoInfo.textContent = `${selected.name} · ${result.duration.toFixed(1)} 秒`; question.disabled = ask.disabled = false; question.placeholder = '例如：刚才发生了什么？'; engineState.textContent = '可以提问'; uploadStatus.textContent = ''; setStatus('视频已准备好。播放或拖动进度条后即可提问。'); question.focus(); } catch (error) { const detail = error.message || '未知错误'; uploadStatus.textContent = `上传失败：${detail}`; uploadStatus.classList.add('error'); engineState.textContent = '上传失败'; setStatus('请查看下方上传提示；也可检查服务端 videoqa.log。', true); } finally { busy = false; selectFile.disabled = false; fileInput.value = ''; } }
    question.addEventListener('keydown', event => { if ((event.ctrlKey || event.metaKey) && event.key === 'Enter') form.requestSubmit(); });
    form.addEventListener('submit', async event => { event.preventDefault(); const text = question.value.trim(); if (!text || !videoId || busy) return; busy = true; ask.disabled = question.disabled = true; const timestamp = video.currentTime || 0; message('user', text, `播放时间 ${timestamp.toFixed(1)} 秒`); question.value = ''; const answer = message('assistant', '', '正在理解视频窗口…'); engineState.textContent = '生成中'; setStatus('正在结合当前画面与短时历史生成回答…'); try { const response = await fetch('/api/questions', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({video_id:videoId,timestamp,question:text}) }); if (!response.ok) { const payload = await response.json(); throw new Error(payload.detail || '请求失败'); } const reader = response.body.getReader(), decoder = new TextDecoder(); let buffer='', eventName='message'; const consume = line => { if (line.startsWith('event:')) eventName=line.slice(6).trim(); else if (line.startsWith('data:')) { const payload=JSON.parse(line.slice(5).trim()); if (eventName==='context') answer.parentElement.querySelector('.meta').textContent=`理解窗口 ${payload.start.toFixed(1)}–${payload.end.toFixed(1)} 秒`; if (eventName==='token') { answer.textContent+=payload.text; messages.scrollTop=messages.scrollHeight; } if (eventName==='error') throw new Error(payload.message); eventName='message'; } }; while (true) { const {value,done}=await reader.read(); buffer+=decoder.decode(value || new Uint8Array(),{stream:!done}); const lines=buffer.split('\n'); buffer=lines.pop(); for (const line of lines) consume(line); if (done) break; } if (!answer.textContent) answer.textContent='模型没有生成回答。'; } catch (error) { answer.textContent=`回答失败：${error.message}`; answer.parentElement.classList.add('error'); setStatus(`请求失败：${error.message}`, true); } finally { busy=false; ask.disabled=question.disabled=false; engineState.textContent='可以提问'; if (!status.classList.contains('error')) setStatus('可继续提问，回答会使用新的播放位置。'); question.focus(); } });
  </script>
</body>
</html>
