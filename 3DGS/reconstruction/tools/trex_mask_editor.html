<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>恐龙轮廓检查</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#14171d;color:#e9edf4;font:14px system-ui,sans-serif}header{padding:16px 22px;background:#202631;display:flex;justify-content:space-between;align-items:center}h1{margin:0;font-size:20px}main{display:grid;grid-template-columns:240px 1fr;gap:18px;padding:18px}aside{background:#202631;border-radius:10px;padding:14px}.frames{display:grid;gap:6px;margin-top:12px}button,select,input{font:inherit}button,select{border:1px solid #48556b;border-radius:6px;padding:8px 10px;background:#293447;color:inherit;cursor:pointer}button:hover{background:#374860}button.active{border-color:#66d6b1;background:#214d43}.done{color:#7ce3b7}button.primary{background:#276a58}button:disabled{opacity:.45;cursor:wait}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px;align-items:center}.viewport{overflow:auto;max-height:76vh;background:#0a0d11;border-radius:8px;border:1px solid #48556b}canvas{display:block;touch-action:none;cursor:crosshair;max-width:none}p{line-height:1.6}.hint{color:#aebbd0;font-size:13px}#status{padding:10px 0;min-height:42px;color:#86e5c3}#candidates{display:flex;gap:8px;margin-bottom:10px}label{display:flex;gap:7px;align-items:center}.row{display:flex;gap:8px;margin:10px 0}.frame{width:100%;text-align:left}.title{margin:0 0 8px;font-size:16px}#error{color:#ffaaa8;white-space:pre-wrap}@media(max-width:950px){main{grid-template-columns:180px 1fr}}
</style>
<header><h1>恐龙轮廓检查</h1><span id="progress">正在载入…</span></header><main>
<aside><b>逐张检查并保存</b><p class="hint">绿色只覆盖恐龙骨架。保留骨架之间的空隙，擦除楼梯、栏杆和天花板；训练照片的真实背景不会被删除。</p><div class="frames" id="frames"></div><hr><button class="primary" id="finish">完成全部轮廓检查</button><p class="hint">训练图用于前景几何；评测图仅用于恐龙区域指标。此页面不会启动训练。</p></aside>
<section><h2 class="title" id="title"></h2><div class="toolbar">
<select id="mode"><option value="positive">点选恐龙</option><option value="negative">点选背景</option><option value="paint">画笔补选</option><option value="erase">画笔擦除</option><option value="box">拖框限定范围</option></select>
<button id="predict" class="primary">运行SAM</button><button id="undo">撤销</button><button id="clearpoints">清空提示点</button><button id="clearmask">清空轮廓</button>
<label>笔刷<input id="brush" type="range" min="2" max="80" value="15" style="width:90px"></label>
<label>缩放<select id="zoom"><option value=".65">65%</option><option value="1" selected>100%</option><option value="1.5">150%</option><option value="2">200%</option></select></label>
<label><input type="checkbox" id="overlay" checked>绿色轮廓</label><button class="primary" id="save">保存本张</button></div>
<div id="candidates"></div><div class="viewport"><canvas id="canvas"></canvas></div><div id="status"></div><div id="error"></div>
<p class="hint">SAM选入背景时，在误选区域增加背景点再运行；缺少骨骼时，在缺失部位增加恐龙点。三个候选可分别查看。局部细节可用画笔修改。保存后再切换照片，避免丢失修改。</p></section></main>
<script>
const $=id=>document.getElementById(id), c=$('canvas'),ctx=c.getContext('2d'),mc=document.createElement('canvas'),mx=mc.getContext('2d',{willReadFrequently:true});
let info,idx=null,rgb=new Image(),positive=[],negative=[],box=null,history=[],dirty=false,down=false,last=null,candidates=[],candidateIndex=null;
async function api(path,data){let r=await fetch(path,data===undefined?{}:{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});let x=await r.json();if(!r.ok)throw Error(x.error||r.statusText);return x}
function status(s){$('status').textContent=s;$('error').textContent=''}function fail(e){$('error').textContent=e.message||String(e)}
function image(src){return new Promise((resolve,reject)=>{let i=new Image();i.onload=()=>resolve(i);i.onerror=()=>reject(Error('图像载入失败'));i.src=src})}
function snapshot(){history.push({mask:mc.toDataURL(),positive:structuredClone(positive),negative:structuredClone(negative),box:box&&[...box]});if(history.length>25)history.shift()}
function show(){ctx.clearRect(0,0,c.width,c.height);ctx.drawImage(rgb,0,0);if($('overlay').checked){let m=mx.getImageData(0,0,c.width,c.height),v=m.data;for(let i=0;i<v.length;i+=4){let a=v[i]>127?115:0;v[i]=30;v[i+1]=240;v[i+2]=80;v[i+3]=a}let temp=document.createElement('canvas');temp.width=c.width;temp.height=c.height;temp.getContext('2d').putImageData(m,0,0);ctx.drawImage(temp,0,0)}for(let [points,color] of [[positive,'#fff'],[negative,'#ff4444']])for(let p of points){ctx.beginPath();ctx.arc(p[0]*c.width,p[1]*c.height,5,0,7);ctx.fillStyle=color;ctx.fill();ctx.strokeStyle='#111';ctx.stroke()}if(box){ctx.strokeStyle='#ffca50';ctx.lineWidth=2;ctx.strokeRect(box[0]*c.width,box[1]*c.height,(box[2]-box[0])*c.width,(box[3]-box[1])*c.height)}}
function resize(){c.style.width=(c.width*Number($('zoom').value))+'px'}
function renderFrames(){let count=info.frames.filter(f=>f.reviewed).length;$('progress').textContent=`已保存 ${count} / ${info.frames.length} 张`;$('frames').innerHTML='';for(let f of info.frames){let b=document.createElement('button');b.className='frame'+(f.idx===idx?' active':'')+(f.reviewed?' done':'');b.textContent=`${f.reviewed?'✓':'○'} ${f.group==='train'?'训练':'评测'} · ${f.idx}`;b.onclick=()=>load(f.idx);$('frames').appendChild(b)}}
async function load(next){if(dirty&&!confirm('本张修改还未保存，仍要切换吗？'))return;try{let f=await api('/api/frame?idx='+next);idx=next;rgb=await image('/image?idx='+idx);c.width=mc.width=rgb.width;c.height=mc.height=rgb.height;mx.fillStyle='#000';mx.fillRect(0,0,c.width,c.height);if(f.mask){let m=await image(f.mask);mx.drawImage(m,0,0)}positive=f.prompt.positive||[];negative=f.prompt.negative||[];box=f.prompt.box||null;history=[];candidates=[];$('candidates').innerHTML='';dirty=false;resize();show();renderFrames();$('title').textContent=`${f.group==='train'?'训练轮廓（用于Visual Hull）':'评测轮廓（仅用于评测）'} · ${f.name}`;status('请检查绿色轮廓，修正后保存本张。')}catch(e){fail(e)}}
function point(e){let r=c.getBoundingClientRect();return [Math.max(0,Math.min(1,(e.clientX-r.left)/r.width)),Math.max(0,Math.min(1,(e.clientY-r.top)/r.height))]}
function stroke(a,b){mx.strokeStyle=$('mode').value==='paint'?'white':'black';mx.lineWidth=Number($('brush').value);mx.lineCap='round';mx.beginPath();mx.moveTo(a[0]*c.width,a[1]*c.height);mx.lineTo(b[0]*c.width,b[1]*c.height);mx.stroke();show()}
c.onpointerdown=e=>{if(idx===null)return;c.setPointerCapture(e.pointerId);let p=point(e);snapshot();dirty=true;let mode=$('mode').value;if(mode==='positive'){positive.push(p);show()}else if(mode==='negative'){negative.push(p);show()}else{down=true;last=p;if(mode==='box'){box=[...p,...p];show()}else stroke(p,[p[0]+.0001,p[1]])}};
c.onpointermove=e=>{if(!down)return;let p=point(e);if($('mode').value==='box'){box=[Math.min(last[0],p[0]),Math.min(last[1],p[1]),Math.max(last[0],p[0]),Math.max(last[1],p[1])];show()}else{stroke(last,p);last=p}};c.onpointerup=()=>down=false;c.oncontextmenu=e=>e.preventDefault();
$('overlay').onchange=show;$('zoom').onchange=resize;$('clearpoints').onclick=()=>{snapshot();positive=[];negative=[];box=null;dirty=true;show()};$('clearmask').onclick=()=>{snapshot();mx.fillStyle='#000';mx.fillRect(0,0,c.width,c.height);dirty=true;show()};
$('undo').onclick=async()=>{if(!history.length)return;let h=history.pop();mx.drawImage(await image(h.mask),0,0);positive=h.positive;negative=h.negative;box=h.box;dirty=true;show()};
async function choose(i){snapshot();mx.drawImage(await image(candidates[i].mask),0,0);candidateIndex=i;dirty=true;show();for(let b of $('candidates').children)b.classList.toggle('active',Number(b.dataset.index)===i)}
$('predict').onclick=async()=>{let expected=idx;$('predict').disabled=true;status('正在运行SAM，请稍候…');try{let result=await api('/api/predict',{idx,positive,negative,box});if(idx!==expected)return;candidates=result.candidates;$('candidates').innerHTML='';for(let [i,a] of candidates.entries()){let b=document.createElement('button');b.dataset.index=i;b.textContent=`候选${i+1} · 分数 ${a.score.toFixed(2)} · 面积 ${(a.area*100).toFixed(1)}%`;b.onclick=()=>choose(i);$('candidates').appendChild(b)}await choose(result.selected);status('请比较候选轮廓，确认没有把背景选入。')}catch(e){fail(e)}finally{$('predict').disabled=false}};
$('save').onclick=async()=>{try{let result=await api('/api/save',{idx,positive,negative,box,candidate:candidateIndex,mask:mc.toDataURL('image/png')});dirty=false;info=await api('/api/info');renderFrames();status('本张已保存。可以切换到下一张。')}catch(e){fail(e)}};
$('finish').onclick=async()=>{try{if(dirty)throw Error('请先保存当前照片。');let result=await api('/api/finalize',{});status(result.message)}catch(e){fail(e)}};
window.onbeforeunload=e=>{if(dirty){e.preventDefault();e.returnValue=''}};
(async()=>{try{info=await api('/api/info');renderFrames();await load(info.frames.find(f=>!f.reviewed)?.idx??info.frames[0].idx)}catch(e){fail(e)}})();
</script></html>
