[project]
name = "mage-video-demo"
version = "0.1.0"
description = "Uploaded-video commentary and QA demo; local Mage-VL, browser speech synthesis"
requires-python = ">=3.11,<3.12"
dependencies = [
  "torch==2.11.0",
  "torchvision==0.26.0",
  "transformers==5.17.0",
  "accelerate==1.15.0",
  "safetensors==0.8.0",
  "huggingface-hub==1.33.0",
  "tokenizers==0.23.2",
  "numpy==1.26.4",
  "pillow==12.3.0",
  "opencv-python-headless==4.11.0.86",
  "fastapi==0.141.1",
  "uvicorn==0.54.0",
  "python-multipart==0.0.32",
  "pydantic==2.13.5",
  "pydantic-settings>=2.7,<3",
  "tqdm==4.70.1",
]

[dependency-groups]
dev = ["pytest==8.4.2", "httpx==0.28.1"]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[[tool.uv.index]]
name = "tsinghua"
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }
